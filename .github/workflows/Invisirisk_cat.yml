name: Ruby build
on:
  workflow_dispatch:

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      - name: Install Git v2.50.1
        run: |
          # Install build dependencies for Git
          sudo apt-get update
          sudo apt-get install -y make libssl-dev libghc-zlib-dev libcurl4-gnutls-dev libexpat1-dev gettext wget
          
          # Download, compile, and install Git v2.50.1
          wget https://github.com/git/git/archive/refs/tags/v2.50.1.tar.gz -O git.tar.gz
          tar -xzf git.tar.gz
          cd git-2.50.1
          make prefix=/usr/local all
          sudo make prefix=/usr/local install
          
      - name: Verify Git Version
        run: git --version

      - name: Setup PSE
        uses: invisirisk/pse-action@dev-test
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY_L_STAGE }}
          mode: docker-intercept

      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1' # specify your Ruby version
          
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install  # If you have a Gemfile
          gem list # This will list all installed gems
          
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@dev-test
        with:
          cleanup: "true"
          
  gather_analytics:
      runs-on: ubuntu-latest
      name: Gather Analytics
      needs: RUBY
      if: always()
      steps:
      - name: Gather Status
        uses: invisirisk/pse-action@dev-test
        with:
         api_url: "https://app.stage.invisirisk.com"
         app_token: ${{ secrets.IR_API_KEY_L_STAGE }}
         send_job_status: "true"
