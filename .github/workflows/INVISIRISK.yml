name: Ruby build
on:
  workflow_dispatch:

jobs:
  RUBY:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      - name: Setup PSE
        uses: invisirisk/pse-action@dev-test
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY_L_STAGE }}

      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4' # specify your Ruby version
          
      - name: Install dependencies
        run: |
          gem install bundler
          bundle install  # If you have a Gemfile
          gem list # This will list all installed gems
          
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@dev-test
        with:
          cleanup: "true"
          
  gather_analytics:
       runs-on: ubuntu-latest
       name: Gather Analytics
       needs: RUBY
       if: always()
       steps:
       - name: Gather Status
         uses: invisirisk/pse-action@dev-test
         with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY_L_STAGE }}
          send_job_status: "true"
